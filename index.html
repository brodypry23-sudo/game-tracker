<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tracker</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="container">
    <h1>🎮 Game Tracker</h1>

    <!-- Search section -->
    <section class="search-sort">
      <h2>Search for a Game</h2>
      <form id="search-form">
        <div class="mb-3">
          <input type="text" id="search-input" placeholder="Game name...">
        </div>
        <button type="submit">Search</button>
      </form>
    </section>

    <!-- Status message -->
    <p id="status-msg"></p>

    <!-- Search results -->
    <section>
      <h2>Search Results</h2>
      <ol class="list" id="results"></ol>
    </section>

    <!-- Watchlist -->
    <section id="mList">
      <h2 class="ml-3">My Watchlist</h2>
      <button id="check-updates-btn">Check for Updates</button>
      <ol class="list" id="watchlist"></ol>
    </section>

    <footer>
      <p>Copyright &copy; <span id="date"></span> Game Tracker</p>
    </footer>
  </main>

  <!-- watchlist.js must load before app.js so the Watchlist class exists -->
  <script src="./js/watchlist.js"></script>
  <script src="./js/app.js"></script>
  <script>
    document.getElementById('date').textContent = new Date().getFullYear();
  </script>
</body>
</html>
