<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header text-center">
    <h1>Game Tracker</h1>
    <nav aria-label="Main">
      <a class="tab active" href="index.html" aria-current="page">Tracker</a>
      <a class="tab" href="contact.html">Contact / Info</a>
    </nav>
  </header>

  <main class="container my-4">

  <!-- ===== STATUS ===== -->
  <p id="status-msg" class="status" role="status" aria-live="polite"></p>

  <!-- ===== SEARCH ===== -->
  <section class="panel" aria-labelledby="search-heading">
    <h2 id="search-heading">Search for a game</h2>
    <form id="search-form" novalidate>
      <label for="search-input" class="form-label">Game name <span aria-hidden="true">*</span></label>
      <input id="search-input" class="form-control" type="text" maxlength="40"
             placeholder="Game name" aria-describedby="search-hint search-error" autocomplete="off">
      <p id="search-hint" class="hint">Required, 2&ndash;40 characters</p>
      <p id="search-error" class="error-text" role="alert"></p>
      <button type="submit" class="btn btn-dark">Search</button>
    </form>
  </section>

  <!-- ===== RESULTS ===== -->
  <section class="panel" aria-labelledby="results-heading">
    <h2 id="results-heading">Search results</h2>
    <ul id="results" class="list-unstyled mb-0">
      <li class="empty-box">No search results</li>
    </ul>
  </section>

  <!-- ===== WATCHLIST ===== -->
  <section class="panel" aria-labelledby="watchlist-heading">
    <h2 id="watchlist-heading">My watchlist</h2>
    <button id="check-updates-btn" type="button" class="btn btn-outline-dark btn-sm mb-3">Check for Updates</button>
    <ul id="watchlist" class="list-unstyled mb-0">
      <li class="empty-box">Your watchlist is empty</li>
    </ul>
  </section>

  <!-- ===== PLAYERS ===== -->
  <section class="panel" aria-labelledby="players-heading">
    <h2 id="players-heading">Players online now</h2>
    <p class="hint">Live player totals provided by Steam.</p>
    <canvas id="player-chart" role="img" aria-label="Bar chart of players online now for each game on your watchlist"></canvas>
    <ul id="player-list" class="hint"></ul>
  </section>

  </main>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/config.js"></script>
  <script src="js/GameApi.js"></script>
  <script src="js/Watchlist.js"></script>
  <script src="js/SearchForm.js"></script>
  <script src="js/PlayerChart.js"></script>
  <script src="js/App.js"></script>
</body>
</html>
