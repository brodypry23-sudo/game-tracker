<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact / Info - Game Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
  <header class="site-header text-center">
    <h1>Game Tracker</h1>
    <nav aria-label="Main">
      <a class="tab" href="index.html">Tracker</a>
      <a class="tab active" href="contact.html" aria-current="page">Contact / Info</a>
    </nav>
  </header>

  <main class="container my-4">

    <!-- ===== ABOUT ===== -->
    <section class="panel" aria-labelledby="about-heading">
      <h2 id="about-heading">About Game Tracker</h2>
      <p class="mb-0">Game Tracker is a simple place to search for games, build a personal watchlist, and check for the latest patch notes.</p>
    </section>

    <!-- ===== CONTACT FORM ===== -->
    <section class="panel" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact us</h2>

      <form id="contact-form" method="post" novalidate>

            <!-- Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Name <span aria-hidden="true">*</span></label>
                <input id="name" name="name" class="form-control" type="text" placeholder="Your name"
                        autocomplete="name" aria-describedby="name-error">
                <p id="name-error" class="error-text" role="alert"></p>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email <span aria-hidden="true">*</span></label>
                <input id="email" name="email" class="form-control" type="email" placeholder="you@example.com"
                        autocomplete="email" aria-describedby="email-error">
                <p id="email-error" class="error-text" role="alert"></p>
            </div>

            <!-- Subject -->
            <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <select id="subject" name="subject" class="form-select">
                <option>General question</option>
                <option>Bug report</option>
                <option>Feature suggestion</option>
                <option>Other</option>
                </select>
            </div>

            <!-- Message -->
            <div class="mb-3">
                <label for="message" class="form-label">Message <span aria-hidden="true">*</span></label>
                <textarea id="message" name="message" class="form-control" rows="5"
                        placeholder="How can we help?" aria-describedby="message-error"></textarea>
                <p id="message-error" class="error-text" role="alert"></p>
            </div>

            <!-- Submit and status -->
            <p class="hint">* required</p>
            <button type="submit" class="btn btn-dark">Send message</button>
            <p id="form-status" class="status mt-3" role="status" aria-live="polite"></p>

      </form>
      
    </section>

  </main>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/config.js"></script>
  <script src="js/ContactForm.js"></script>
</body>
</html>
